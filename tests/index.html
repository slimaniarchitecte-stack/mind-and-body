<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mind and Body: tests</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    body { margin: 0; padding: 32px 20px 64px; background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--font); }
    main { max-width: 760px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 30px; font-weight: 700; letter-spacing: -.03em; }
    #summary { margin: 0 0 20px; font-weight: 620; }
    #summary.pass { color: var(--c-food); }
    #summary.fail { color: var(--danger); }
    ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--ink); }
    li { padding: 9px 0 9px 22px; border-bottom: 1px solid var(--line); position: relative; }
    li::before { content: ""; position: absolute; left: 2px; top: 15px; width: 9px; height: 9px; background: var(--c-food); }
    li.fail { color: var(--danger); font-weight: 560; }
    li.fail::before { background: var(--danger); }
  </style>
</head>
<body>
  <main>
    <h1>Tests</h1>
    <p id="summary">Running...</p>
    <ul id="list"></ul>
  </main>
  <script type="module" src="run.js"></script>
</body>
</html>
